<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Cassette body -->
  <rect x="2" y="7" width="28" height="18" rx="3" fill="#1a1a1a"/>
  <!-- Body highlight -->
  <rect x="2" y="7" width="28" height="18" rx="3" fill="none" stroke="#444" stroke-width="1"/>

  <!-- Tape window cutout -->
  <rect x="8" y="11" width="16" height="8" rx="2" fill="#2a2a2a" stroke="#555" stroke-width="0.75"/>

  <!-- Left reel -->
  <circle cx="12" cy="15" r="3" fill="#111" stroke="#666" stroke-width="0.75"/>
  <circle cx="12" cy="15" r="1.2" fill="#555"/>
  <!-- Left reel spokes -->
  <line x1="12" y1="12.5" x2="12" y2="13.5" stroke="#666" stroke-width="0.75"/>
  <line x1="12" y1="16.5" x2="12" y2="17.5" stroke="#666" stroke-width="0.75"/>
  <line x1="9.5" y1="15" x2="10.5" y2="15" stroke="#666" stroke-width="0.75"/>
  <line x1="13.5" y1="15" x2="14.5" y2="15" stroke="#666" stroke-width="0.75"/>

  <!-- Right reel -->
  <circle cx="20" cy="15" r="3" fill="#111" stroke="#666" stroke-width="0.75"/>
  <circle cx="20" cy="15" r="1.2" fill="#555"/>
  <!-- Right reel spokes -->
  <line x1="20" y1="12.5" x2="20" y2="13.5" stroke="#666" stroke-width="0.75"/>
  <line x1="20" y1="16.5" x2="20" y2="17.5" stroke="#666" stroke-width="0.75"/>
  <line x1="17.5" y1="15" x2="18.5" y2="15" stroke="#666" stroke-width="0.75"/>
  <line x1="21.5" y1="15" x2="22.5" y2="15" stroke="#666" stroke-width="0.75"/>

  <!-- Tape path between reels -->
  <path d="M15 17.5 Q16 18.5 17 17.5" stroke="#888" stroke-width="0.75" fill="none"/>

  <!-- Bottom notches -->
  <rect x="5" y="23" width="4" height="2" rx="0.5" fill="#333"/>
  <rect x="23" y="23" width="4" height="2" rx="0.5" fill="#333"/>

  <!-- Red record dot -->
  <circle cx="16" cy="10" r="1" fill="#cc0000"/>
</svg>
